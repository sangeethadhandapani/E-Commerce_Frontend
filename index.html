<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">ShopEasy</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart 🛒 <span id="cartCount">0</span></a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div>
            <h1>Welcome to ShopEasy</h1>
            <p>Find the products you love at the best prices.</p>
            <a href="#products" class="shop-btn">Shop Now</a>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products-section" id="products">

        <h2>Our Products</h2>

        <!-- Search and Filter -->
        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="fashion">Fashion</option>
                <option value="electronics">Electronics</option>
                <option value="accessories">Accessories</option>
            </select>

        </div>

        <!-- Products -->
        <div class="product-container" id="productContainer"></div>

    </section>

    <!-- Product Details Modal -->
    <div class="modal" id="productModal">

        <div class="modal-content">

            <span class="close" onclick="closeModal()">&times;</span>

            <div id="productDetails"></div>

        </div>

    </div>

    <!-- Cart Section -->
    <section class="cart-section" id="cart">

        <h2>Shopping Cart</h2>

        <div id="cartItems">
            <p class="empty-cart">Your cart is empty.</p>
        </div>

        <div class="cart-total">

            <h3>
                Total Items:
                <span id="totalItems">0</span>
            </h3>

            <h3>
                Total Price:
                ₹<span id="totalPrice">0</span>
            </h3>

            <button onclick="checkout()" class="checkout-btn">
                Checkout
            </button>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
